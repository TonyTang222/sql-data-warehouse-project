name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: SQL Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install sqlfluff
        run: pip install sqlfluff

      - name: Run SQL linting
        run: |
          sqlfluff lint dbt_project/models/ \
            --config dbt_project/.sqlfluff

  dbt-build:
    name: dbt Build (seeds + models + snapshot + tests)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dbt_user
          POSTGRES_PASSWORD: dbt_pass
          POSTGRES_DB: data_warehouse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dbt_user -d data_warehouse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DBT_HOST: localhost
      DBT_PORT: 5432
      DBT_USER: dbt_user
      DBT_PASS: dbt_pass
      DBT_DBNAME: data_warehouse

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dbt
        run: pip install dbt-core dbt-postgres

      - name: Install dbt packages
        working-directory: dbt_project
        run: dbt deps --profiles-dir .

      - name: dbt build
        working-directory: dbt_project
        run: dbt build --profiles-dir . --target dev
