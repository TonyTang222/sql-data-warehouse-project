[project]
name = "dagster_project"
version = "0.1.0"
description = "Dagster orchestration layer for the Sales DW dbt project."
requires-python = ">=3.10,<3.15"
dependencies = [
    "dagster",
    "dagster-dbt",
    "dagster-webserver",
]

[build-system]
requires = ["hatchling>=1.19.0"]
build-backend = "hatchling.build"

[tool.dagster]
module_name = "dagster_project.definitions"
code_location_name = "dagster_project"
